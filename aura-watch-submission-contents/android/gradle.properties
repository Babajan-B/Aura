## Gradle daemon — enough heap for AGP + Kotlin 2.0 on Apple Silicon
org.gradle.jvmargs=-Xmx2048m -Xms256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

## Kotlin compile daemon — MUST disable Parallel GC on Apple Silicon / Java 17+
## (Kotlin 2.0 daemon crashes with GC auto-selection on macOS ARM)
kotlin.daemon.jvm.options=-Xmx1536m -Xms128m -XX:-UseParallelGC -XX:+UseG1GC

## Build performance
org.gradle.parallel=true
org.gradle.caching=true
## configuration-cache disabled — incompatible with some AGP 8.5 transforms on first sync
org.gradle.configuration-cache=false
org.gradle.daemon=true

## Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

## Kotlin
kotlin.code.style=official
kotlin.incremental=true
